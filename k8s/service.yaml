apiVersion: v1
kind: Service
metadata:
  name: rpc-service
spec:
  type: NodePort
  selector:
    app: rpc-server
  ports:
    - protocol: TCP
      port: 5000        # Service port inside the cluster
      targetPort: 5000  # containerPort of the Pods
      nodePort: 30007   # External access: <worker_public_ip>:30007
